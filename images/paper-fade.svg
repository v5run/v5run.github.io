<svg xmlns="http://www.w3.org/2000/svg" width="520" height="900" viewBox="0 0 520 900">
  <!-- uneven thermal density: soft, wide patches of paper colour laid over the
       ink so some lines print a touch paler than others -->
  <filter id="fade" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".0035 .016" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .984  0 0 0 0 .980  0 0 0 0 .969  1.6 0 0 0 -.98"/>
  </filter>
  <rect width="520" height="900" filter="url(#fade)"/>
</svg>
